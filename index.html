<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Favorite Pokemon</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <!-- =========================================
           Header
           ========================================= -->

      <header class="header">
        <h1>Who's Your Favorite Pokemon?</h1>

        <p class="subtitle">
          Pick your favorite Pokemon in each matchup. If you can't decide, click
          'skip'.
        </p>

        <div class="progress-container">
          <div class="progress-label">
            <span id="matchup-number">Matchup 1 of 66,795</span>
            <span id="remaining-count">66,795 remaining</span>
          </div>

          <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>
      </header>

      <!-- =========================================
           Matchup
           ========================================= -->

      <section class="battle-area matchup" aria-label="Pokémon matchup">
        <!-- Pokémon A -->

        <button
          id="pokemon-a"
          class="pokemon-card"
          type="button"
          aria-label="Choose the first Pokémon"
        >
          <div class="pokemon-image-container">
            <div class="loading">Loading...</div>

            <img id="image-a" class="pokemon-image" alt="" />
          </div>

          <div class="pokemon-name" id="name-a">—</div>
        </button>

        <!-- VS -->

        <div class="vs" aria-hidden="true">
          <span>VS</span>
        </div>

        <!-- Pokémon B -->

        <button
          id="pokemon-b"
          class="pokemon-card"
          type="button"
          aria-label="Choose the second Pokémon"
        >
          <div class="pokemon-image-container">
            <div class="loading">Loading...</div>

            <img id="image-b" class="pokemon-image" alt="" />
          </div>

          <div class="pokemon-name" id="name-b">—</div>
        </button>
      </section>

      <!-- =========================================
           Actions
           ========================================= -->

      <section class="actions">
        <button id="defer-button" class="secondary-button" type="button">
          Skip
        </button>
      </section>

      <!-- =========================================
           Save / Load
           ========================================= -->

      <footer class="footer">
        <button id="save-game-button" class="utility-button" type="button">
          Save Game
        </button>

        <button id="load-game-button" class="utility-button" type="button">
          Load Game
        </button>

        <button id="reset-button" class="text-button danger" type="button">
          Reset
        </button>

        <input id="load-game-input" type="file" accept=".txt,.json" hidden />
      </footer>
    </main>

    <!--
      IMPORTANT:
      pokelist.js must load BEFORE app.js because
      app.js uses the global POKEMON array.
    -->

    <script src="pokelist.js"></script>
    <script src="app.js"></script>
  </body>
</html>
